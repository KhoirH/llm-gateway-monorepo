services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway
      POSTGRES_DB: gateway
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway"]
      interval: 5s
      timeout: 3s
      retries: 10

  dataset:
    build:
      context: ..
      dockerfile: infra/dataset.Dockerfile
    profiles: ["tools"]
    volumes:
      - ../data:/data

  kb-build:
    build:
      context: ..
      dockerfile: infra/pytools.Dockerfile
    profiles: ["tools"]
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgres://gateway:gateway@db:5432/gateway
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../data:/data
    command: python /app/build_kb.py /data

  retrieval-try:
    build:
      context: ..
      dockerfile: infra/pytools.Dockerfile
    profiles: ["tools"]
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgres://gateway:gateway@db:5432/gateway
    depends_on:
      db:
        condition: service_healthy
    command: python /app/try_retrieval.py

  gateway-a:
    build:
      context: ..
      dockerfile: infra/gateway.Dockerfile
    profiles: ["tools"]
    env_file:
      - ../.env
    environment:
      GATEWAY_HOST: 0.0.0.0
      DATABASE_URL: postgres://gateway:gateway@db:5432/gateway
      SUPPORT_PROMPT_VERSION: v1
      SUPPORT_MODEL_OVERRIDE: fast
    depends_on:
      db:
        condition: service_healthy

  gateway-b:
    build:
      context: ..
      dockerfile: infra/gateway.Dockerfile
    profiles: ["tools"]
    env_file:
      - ../.env
    environment:
      GATEWAY_HOST: 0.0.0.0
      DATABASE_URL: postgres://gateway:gateway@db:5432/gateway
      SUPPORT_PROMPT_VERSION: v2
      SUPPORT_MODEL_OVERRIDE: strong
    depends_on:
      db:
        condition: service_healthy

  eval:
    build:
      context: ..
      dockerfile: infra/pytools.Dockerfile
    profiles: ["tools"]
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgres://gateway:gateway@db:5432/gateway
      GATEWAY_A_URL: http://gateway-a:3000
      GATEWAY_B_URL: http://gateway-b:3000
    depends_on:
      - gateway-a
      - gateway-b
    volumes:
      - ../data:/data:ro
      - ../docs:/out
    command: python /app/run_eval.py /data /out/eval-results

volumes:
  pgdata:

