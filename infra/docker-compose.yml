services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway
      POSTGRES_DB: gateway
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway"]
      interval: 5s
      timeout: 3s
      retries: 10

  dataset:
    build:
      context: ..
      dockerfile: infra/dataset.Dockerfile
    profiles: ["tools"]
    volumes:
      - ../data:/data

  kb-build:
    build:
      context: ..
      dockerfile: infra/pytools.Dockerfile
    profiles: ["tools"]
    env_file:
      - ../../.env
    environment:
      DATABASE_URL: postgres://gateway:gateway@db:5432/gateway
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../data:/data
    command: python /app/build_kb.py /data

  retrieval-try:
    build:
      context: ..
      dockerfile: infra/pytools.Dockerfile
    profiles: ["tools"]
    env_file:
      - ../../.env
    environment:
      DATABASE_URL: postgres://gateway:gateway@db:5432/gateway
    depends_on:
      db:
        condition: service_healthy
    command: python /app/try_retrieval.py

volumes:
  pgdata:
